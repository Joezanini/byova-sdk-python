name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs,media]"
          pip install build

      - name: Generate media gRPC stubs
        run: |
          python -m grpc_tools.protoc \
            -I src/webex_byova/media/_internal/proto \
            --python_out=src/webex_byova/media/_internal/generated \
            --grpc_python_out=src/webex_byova/media/_internal/generated \
            --pyi_out=src/webex_byova/media/_internal/generated \
            src/webex_byova/media/_internal/proto/byova_common.proto \
            src/webex_byova/media/_internal/proto/voicevirtualagent.proto
          python - <<'PY'
          from pathlib import Path
          out = Path("src/webex_byova/media/_internal/generated")
          for f in out.glob("*_grpc.py"):
              t = f.read_text()
              t = t.replace("import voicevirtualagent_pb2", "from webex_byova.media._internal.generated import voicevirtualagent_pb2")
              t = t.replace("import byova_common_pb2", "from webex_byova.media._internal.generated import byova_common_pb2")
              f.write_text(t)
          f = out / "voicevirtualagent_pb2.py"
          t = f.read_text().replace("import byova_common_pb2", "from webex_byova.media._internal.generated import byova_common_pb2")
          f.write_text(t)
          (out / "__init__.py").write_text('"""Generated gRPC stubs."""\n')
          PY

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest tests/ -v

      - name: Build docs
        if: matrix.python-version == '3.12'
        run: mkdocs build -f docs/mkdocs.yml --strict

      - name: Build
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Upload Distribution Files
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: distribution-files
          path: dist/
